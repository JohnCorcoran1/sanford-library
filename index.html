<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanford Library</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --skin-background: #111111;
            --skin-surface: #181818;
            --skin-surface-alt: #222222;
            --skin-text: #eeeeee;
            --skin-muted: #aaaaaa;
            --skin-border: #444444;
            --skin-accent: #d6a84f;
            --skin-accent-text: #111111;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #eee;
            font-family: Arial, Helvetica, sans-serif;
        }
        body { min-height: 100vh; }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17,17,17,.96);
            border-bottom: 1px solid #333;
            padding: 16px;
            backdrop-filter: blur(8px);
        }
        .header-inner {
            max-width: 1800px;
            margin: 0 auto;
        }
        h1 {
            margin: 0;
            font-size: 28px;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }
        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(110px, 1fr)) auto;
            gap: 8px;
        }
        input, select {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #eee;
            font-size: 14px;
        }
        button {
            min-height: 38px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #292929;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #353535; }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid #d6a84f;
            outline-offset: 2px;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }
        .add-title-button {
            flex: 0 0 auto;
            border-color: #9b7430;
            background: #5b421c;
            font-weight: 700;
        }
        .add-title-button:hover:not(:disabled) { background: #725324; }
        .family-filter {
            min-width: 42px;
            width: 42px;
            height: 38px;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .family-filter img {
            display: block;
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .family-filter.active {
            border-color: #d6a84f;
            background: #332a18;
            box-shadow: 0 0 0 1px #d6a84f;
        }
        .size-control {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .size-control input { width: 220px; }
        .size-value {
            min-width: 55px;
            color: #aaa;
        }
        .count {
            margin-top: 8px;
            color: #999;
            font-size: 13px;
        }
        .notice {
            min-height: 18px;
            margin-top: 5px;
            color: #8fcf8f;
            font-size: 13px;
        }
        .notice.error { color: #ef8f8f; }
        .grid {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--poster-size), 1fr));
            gap: 24px 16px;
        }
        .movie-card {
            min-width: 0;
        }
        .poster {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: #222;
            border-radius: 5px;
            border: 1px solid transparent;
            box-shadow: 0 1px 5px rgba(0,0,0,.65);
        }
        .poster-missing {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }
        .movie-info { padding-top: 8px; }
        .movie-title {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.2;
        }
        .movie-details {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px;
            margin-top: 5px;
        }
        .detail {
            font-size: 11px;
            color: #aaa;
            background: #222;
            border-radius: 3px;
            padding: 2px 4px;
        }
        .family-detail {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
        }
        .family-detail img {
            display: block;
            width: 22px;
            height: 22px;
            object-fit: contain;
        }
        dialog {
            width: min(680px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            padding: 0;
            overflow: auto;
            border: 1px solid #555;
            border-radius: 10px;
            background: #181818;
            color: #eee;
            box-shadow: 0 18px 60px rgba(0,0,0,.75);
        }
        dialog::backdrop { background: rgba(0,0,0,.75); }
        .dialog-form { padding: 20px; }
        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .dialog-header h2 {
            margin: 0;
            font-size: 22px;
        }
        .dialog-close {
            width: 38px;
            padding: 0;
            font-size: 22px;
            line-height: 1;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .tmdb-panel {
            grid-column: 1 / -1;
            padding: 14px;
            border: 1px solid #3c5363;
            border-radius: 8px;
            background: #14202a;
        }
        .tmdb-search-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
        }
        .tmdb-results {
            display: grid;
            gap: 8px;
            max-height: 310px;
            margin-top: 10px;
            overflow: auto;
        }
        .tmdb-result {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            gap: 10px;
            width: 100%;
            min-height: 76px;
            padding: 7px;
            text-align: left;
            background: #1d2a34;
        }
        .tmdb-result:hover:not(:disabled) { background: #293945; }
        .tmdb-result img,
        .tmdb-poster-placeholder {
            display: grid;
            place-items: center;
            width: 48px;
            height: 72px;
            border-radius: 3px;
            background: #293945;
            object-fit: cover;
            color: #81909a;
            font-size: 10px;
            text-align: center;
        }
        .tmdb-result-title {
            display: block;
            margin: 4px 0 5px;
            font-weight: 700;
        }
        .tmdb-result-meta {
            display: block;
            color: #9fb0bc;
            font-size: 12px;
        }
        .tmdb-selected {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #4d758c;
            border-radius: 7px;
            background: #1d2a34;
        }
        .tmdb-selected img,
        .tmdb-selected .tmdb-poster-placeholder {
            width: 64px;
            height: 96px;
            border-radius: 4px;
            object-fit: cover;
        }
        .tmdb-selected strong,
        .tmdb-selected small { display: block; }
        .tmdb-selected small { margin-top: 4px; color: #9fb0bc; font-size: 12px; }
        .manual-fields-label {
            grid-column: 1 / -1;
            margin: 2px 0 -4px;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .form-field {
            display: grid;
            gap: 6px;
            color: #ccc;
            font-size: 13px;
        }
        .form-field.full { grid-column: 1 / -1; }
        .family-toggle-field {
            display: flex;
            align-items: center;
            min-height: 74px;
        }
        .family-toggle {
            width: 68px;
            height: 68px;
            min-height: 0;
            padding: 4px;
            border-color: #555;
            background: #222;
        }
        .family-toggle img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: grayscale(1);
            opacity: .35;
            transition: filter .15s ease, opacity .15s ease;
        }
        .family-toggle[aria-pressed="true"] {
            border-color: #d6a84f;
            background: #332a18;
        }
        .family-toggle[aria-pressed="true"] img {
            filter: none;
            opacity: 1;
        }
        .form-hint {
            color: #888;
            font-size: 12px;
        }
        .form-status {
            min-height: 20px;
            margin-top: 14px;
            color: #ef8f8f;
            font-size: 13px;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .primary-button {
            border-color: #9b7430;
            background: #5b421c;
            font-weight: 700;
        }
        .tmdb-attribution {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 16px 24px;
            color: #777;
            font-size: 11px;
            text-align: center;
        }
        .tmdb-attribution a { color: inherit; }
        .tmdb-attribution img {
            display: block;
            width: 90px;
            height: auto;
            margin: 0 auto 7px;
        }
        .title-actions { display: flex; align-items: center; gap: 8px; }
        .skin-picker { width: auto; min-width: 130px; }
        .skin-button { white-space: nowrap; }
        .skin-colors {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .color-field {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
        }
        .color-field input[type="color"] { width: 42px; height: 38px; padding: 3px; }
        .skin-preview {
            margin: 14px 0;
            padding: 16px;
            border: 1px solid var(--skin-border);
            border-radius: 8px;
            background: var(--skin-background);
            color: var(--skin-text);
        }
        .skin-preview-card {
            padding: 12px;
            border: 1px solid var(--skin-border);
            border-radius: 6px;
            background: var(--skin-surface);
        }
        .skin-preview-card span { color: var(--skin-muted); }
        .skin-preview-card b { color: var(--skin-accent); }
        .danger-button { border-color: #a84b4b; color: #ffb0b0; }

        html, body { background: var(--skin-background); color: var(--skin-text); }
        .header { background: color-mix(in srgb, var(--skin-background) 96%, transparent); border-color: var(--skin-border); }
        input, select, button, .family-filter, .family-toggle { background: var(--skin-surface-alt); color: var(--skin-text); border-color: var(--skin-border); }
        button:hover:not(:disabled) { background: color-mix(in srgb, var(--skin-surface-alt) 82%, var(--skin-text)); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline-color: var(--skin-accent); }
        .add-title-button, .primary-button { background: var(--skin-accent); border-color: var(--skin-accent); color: var(--skin-accent-text); }
        .add-title-button:hover:not(:disabled), .primary-button:hover:not(:disabled) { background: color-mix(in srgb, var(--skin-accent) 82%, white); }
        .count, .size-value, .detail, .manual-fields-label, .form-hint, .tmdb-attribution { color: var(--skin-muted); }
        .detail, .poster { background: var(--skin-surface-alt); }
        dialog { background: var(--skin-surface); color: var(--skin-text); border-color: var(--skin-border); }
        .form-field { color: var(--skin-text); }
        .family-filter.active, .family-toggle[aria-pressed="true"] { border-color: var(--skin-accent); box-shadow: 0 0 0 1px var(--skin-accent); }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
            }
            .controls input[type="search"] {
                flex: 1 1 100%;
                width: 100%;
            }
        }
        @media (max-width: 500px) {
            .header {
                padding: 10px;
            }
            h1 {
                font-size: 24px;
            }
            .title-row { margin-bottom: 8px; }
            .title-row { align-items: flex-start; }
            .title-actions { flex-wrap: wrap; justify-content: flex-end; }
            .skin-picker { min-width: 112px; }
            .skin-button { min-height: 32px; padding: 5px 9px; }
            .add-title-button { min-height: 32px; padding: 5px 9px; }
            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 5px;
            }
            .controls input[type="search"] {
                flex: 1 1 100%;
                width: 100%;
                min-height: 29px;
                height: 29px;
                padding: 3px 8px;
                font-size: 13px;
            }
            #categoryFilter {
                width: 145px;
                flex: 0 0 145px;
            }
            #formatFilter {
                width: 130px;
                flex: 0 0 130px;
            }
            #hdrFilter {
                width: 105px;
                flex: 0 0 105px;
            }
            #audioFilter {
                width: 110px;
                flex: 0 0 110px;
            }
            #sortSelect {
                width: 145px;
                flex: 0 0 145px;
            }
            .family-filter {
                min-width: 34px;
                width: 34px;
                height: 29px;
                padding: 2px;
                border-radius: 5px;
            }
            .family-filter img {
                width: 23px;
                height: 23px;
            }
            .controls select {
                min-height: 29px;
                height: 29px;
                padding: 3px 24px 3px 7px;
                border-radius: 5px;
                font-size: 13px;
            }
            .size-control {
                margin-top: 8px;
                gap: 7px;
            }
            .size-control input {
                width: auto;
                flex: 1;
            }
            .count {
                margin-top: 5px;
            }
            .grid {
                gap: 18px 10px;
                padding: 14px 10px 30px;
            }
            .dialog-form { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
            .skin-colors { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="title-row">
                <h1>Sanford Library</h1>
                <div class="title-actions">
                    <select id="skinSelect" class="skin-picker" aria-label="Interface skin"></select>
                    <button id="manageSkinsButton" class="skin-button" type="button" disabled title="Start server.py to add custom skins">Skins</button>
                    <button id="addTitleButton" class="add-title-button" type="button" disabled title="Start server.py to enable catalog editing">+ Add title</button>
                </div>
            </div>
            <div class="controls">
                <input id="search" type="search" placeholder="Search title, category, format, HDR, audio...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <select id="formatFilter">
                    <option value="">All Formats</option>
                </select>
                <select id="hdrFilter">
                    <option value="">All HDR</option>
                </select>
                <select id="audioFilter">
                    <option value="">All Audio</option>
                </select>
                <select id="sortSelect">
                    <option value="order">Library Order</option>
                    <option value="titleAsc">Title A-Z</option>
                    <option value="titleDesc">Title Z-A</option>
                    <option value="format">Format</option>
                    <option value="category">Type</option>
                    <option value="hdr">HDR</option>
                    <option value="audio">Audio</option>
                </select>
                <button id="familyFilter" class="family-filter" type="button" title="Show Family-approved titles" aria-label="Show Family-approved titles" aria-pressed="false"><img src="assets/stevie-approved.png" alt="Stevie Approved"></button>
            </div>
            <div class="size-control">
                <span>Poster Size</span>
                <input id="sizeSlider" type="range" min="120" max="320" value="190">
                <span id="sizeValue" class="size-value">190px</span>
            </div>
            <div id="count" class="count"></div>
            <div id="notice" class="notice" role="status" aria-live="polite"></div>
        </div>
    </header>
    <main id="grid" class="grid" style="--poster-size:190px;" aria-live="polite"></main>
    <dialog id="addTitleDialog" aria-labelledby="addTitleHeading">
        <form id="addTitleForm" class="dialog-form">
            <div class="dialog-header">
                <h2 id="addTitleHeading">Add a title</h2>
                <button id="closeAddTitle" class="dialog-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="form-grid">
                <section class="tmdb-panel" aria-labelledby="tmdbSearchLabel">
                    <label id="tmdbSearchLabel" class="form-field" for="tmdbSearchInput">Search TMDB</label>
                    <div class="tmdb-search-row">
                        <input id="tmdbSearchInput" type="search" maxlength="100" placeholder="Start typing a movie or series title" autocomplete="off" disabled>
                        <button id="tmdbSearchButton" type="button" disabled>Search</button>
                    </div>
                    <div id="tmdbSearchStatus" class="form-hint" role="status" aria-live="polite">Set TMDB_READ_TOKEN and restart the server to enable search.</div>
                    <div id="tmdbResults" class="tmdb-results"></div>
                    <div id="tmdbSelected" class="tmdb-selected hidden"></div>
                </section>
                <label class="form-field full">
                    Title
                    <input name="title" type="text" maxlength="200" required>
                </label>
                <label class="form-field">
                    Category
                    <select name="category" required>
                        <option value="Movie">Movie</option>
                        <option value="Series">Series</option>
                    </select>
                </label>
                <label class="form-field">
                    Duration
                    <input name="duration" type="text" maxlength="50" placeholder="2h 10m or 3 seasons" required>
                </label>
                <div class="manual-fields-label">Your copy</div>
                <label class="form-field">
                    Format
                    <input name="format" type="text" maxlength="100" list="formatOptions" placeholder="UHD BD 4k" required>
                </label>
                <label class="form-field">
                    HDR
                    <input name="hdr" type="text" maxlength="100" list="hdrOptions" placeholder="Leave blank if not applicable">
                </label>
                <label class="form-field">
                    Audio
                    <input name="audio" type="text" maxlength="100" list="audioOptions" placeholder="Dolby Atmos" required>
                </label>
                <div class="form-field family-toggle-field">
                    <input id="familyField" name="family" type="hidden" value="false">
                    <button id="familyToggle" class="family-toggle" type="button" aria-label="Stevie Approved" aria-pressed="false" title="Mark as Stevie Approved">
                        <img src="assets/stevie-approved.png" alt="">
                    </button>
                </div>
                <label class="form-field full">
                    Poster file (optional when a TMDB poster is selected)
                    <input name="poster" type="file" accept="image/jpeg,image/png,image/webp">
                    <span class="form-hint">The selected TMDB poster is used automatically. Choose a file here to override it.</span>
                </label>
            </div>
            <datalist id="formatOptions"></datalist>
            <datalist id="hdrOptions"></datalist>
            <datalist id="audioOptions"></datalist>
            <div id="addTitleStatus" class="form-status" role="status" aria-live="polite"></div>
            <div class="dialog-actions">
                <button id="cancelAddTitle" type="button">Cancel</button>
                <button id="saveTitleButton" class="primary-button" type="submit">Add title</button>
            </div>
        </form>
    </dialog>
    <dialog id="skinDialog" aria-labelledby="skinHeading">
        <form id="skinForm" class="dialog-form">
            <div class="dialog-header">
                <h2 id="skinHeading">Create a custom skin</h2>
                <button id="closeSkinDialog" class="dialog-close" type="button" aria-label="Close">&times;</button>
            </div>
            <label class="form-field full">
                Skin name
                <input name="name" type="text" maxlength="40" required placeholder="Movie night">
            </label>
            <div id="skinColors" class="skin-colors"></div>
            <div id="skinPreview" class="skin-preview">
                <div class="skin-preview-card"><strong>Skin preview</strong><br><span>Secondary text and metadata</span><br><b>Accent color</b></div>
            </div>
            <div id="skinStatus" class="form-status" role="status" aria-live="polite"></div>
            <div class="dialog-actions">
                <button id="deleteSkinButton" class="danger-button hidden" type="button">Delete selected</button>
                <button id="cancelSkinDialog" type="button">Cancel</button>
                <button class="primary-button" type="submit">Save skin</button>
            </div>
        </form>
    </dialog>
    <footer class="tmdb-attribution">
        <a href="https://www.themoviedb.org" target="_blank" rel="noreferrer"><img src="assets/tmdb-logo.svg" alt="TMDB"></a>
        This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>
    <script>
        let cards = [];
        let catalog = [];
        let noticeTimer;
        let tmdbSearchTimer;
        let tmdbSearchController;
        let tmdbDetailController;
        let selectedTmdbTitle = null;
        let customSkins = [];
        const skinStorageKey = 'sanford-library-skin';
        const skinFields = [
            ['background', 'Page background'], ['surface', 'Panels'],
            ['surfaceAlt', 'Controls and tags'], ['text', 'Main text'],
            ['muted', 'Secondary text'], ['border', 'Borders'],
            ['accent', 'Accent'], ['accentText', 'Text on accent']
        ];
        const builtInSkins = [
            {id: 'midnight', name: 'Midnight', background: '#111111', surface: '#181818', surfaceAlt: '#222222', text: '#eeeeee', muted: '#aaaaaa', border: '#444444', accent: '#d6a84f', accentText: '#111111'},
            {id: 'matinee', name: 'Matinee', background: '#f4efe4', surface: '#fffaf0', surfaceAlt: '#e8dfcf', text: '#27221b', muted: '#6f665a', border: '#b8aa96', accent: '#8a3d2f', accentText: '#ffffff'},
            {id: 'deep-blue', name: 'Deep Blue', background: '#07141f', surface: '#0d2030', surfaceAlt: '#173247', text: '#e6f3fa', muted: '#9ab5c5', border: '#31566d', accent: '#55c2d9', accentText: '#051218'}
        ];
        const search = document.getElementById('search');
        const categoryFilter = document.getElementById('categoryFilter');
        const formatFilter = document.getElementById('formatFilter');
        const hdrFilter = document.getElementById('hdrFilter');
        const audioFilter = document.getElementById('audioFilter');
        const sortSelect = document.getElementById('sortSelect');
        const familyFilter = document.getElementById('familyFilter');
        const grid = document.getElementById('grid');
        const count = document.getElementById('count');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const notice = document.getElementById('notice');
        const addTitleButton = document.getElementById('addTitleButton');
        const addTitleDialog = document.getElementById('addTitleDialog');
        const addTitleForm = document.getElementById('addTitleForm');
        const addTitleStatus = document.getElementById('addTitleStatus');
        const saveTitleButton = document.getElementById('saveTitleButton');
        const closeAddTitle = document.getElementById('closeAddTitle');
        const cancelAddTitle = document.getElementById('cancelAddTitle');
        const tmdbSearchInput = document.getElementById('tmdbSearchInput');
        const tmdbSearchButton = document.getElementById('tmdbSearchButton');
        const tmdbSearchStatus = document.getElementById('tmdbSearchStatus');
        const tmdbResults = document.getElementById('tmdbResults');
        const tmdbSelected = document.getElementById('tmdbSelected');
        const familyField = document.getElementById('familyField');
        const familyToggle = document.getElementById('familyToggle');
        const skinSelect = document.getElementById('skinSelect');
        const manageSkinsButton = document.getElementById('manageSkinsButton');
        const skinDialog = document.getElementById('skinDialog');
        const skinForm = document.getElementById('skinForm');
        const skinColors = document.getElementById('skinColors');
        const skinPreview = document.getElementById('skinPreview');
        const skinStatus = document.getElementById('skinStatus');
        const deleteSkinButton = document.getElementById('deleteSkinButton');
        const closeSkinDialog = document.getElementById('closeSkinDialog');
        const cancelSkinDialog = document.getElementById('cancelSkinDialog');

        function allSkins() {
            return [...builtInSkins, ...customSkins];
        }

        function selectedSkin() {
            return allSkins().find(skin => skin.id === skinSelect.value) || builtInSkins[0];
        }

        function applySkin(skin, remember = true) {
            skinFields.forEach(([field]) => {
                const cssName = '--skin-' + field.replace(/[A-Z]/g, letter => '-' + letter.toLowerCase());
                document.documentElement.style.setProperty(cssName, skin[field]);
            });
            document.documentElement.dataset.skin = skin.id;
            if (remember) {
                try { localStorage.setItem(skinStorageKey, skin.id); } catch (_) {}
            }
        }

        function renderSkinOptions(preferredId) {
            const fragment = document.createDocumentFragment();
            const groups = [['Built-in', builtInSkins], ['Custom', customSkins]];
            groups.forEach(([label, skins]) => {
                if (!skins.length) return;
                const group = document.createElement('optgroup');
                group.label = label;
                skins.forEach(skin => {
                    const option = document.createElement('option');
                    option.value = skin.id;
                    option.textContent = skin.name;
                    group.appendChild(option);
                });
                fragment.appendChild(group);
            });
            skinSelect.replaceChildren(fragment);
            const available = allSkins().some(skin => skin.id === preferredId);
            skinSelect.value = available ? preferredId : builtInSkins[0].id;
            applySkin(selectedSkin(), false);
        }

        function buildSkinFields() {
            const defaults = builtInSkins[0];
            skinFields.forEach(([field, labelText]) => {
                const label = document.createElement('label');
                label.className = 'form-field';
                label.textContent = labelText;
                const row = document.createElement('span');
                row.className = 'color-field';
                const color = document.createElement('input');
                color.type = 'color';
                color.name = field;
                color.value = defaults[field];
                color.setAttribute('aria-label', labelText);
                const value = document.createElement('span');
                value.textContent = color.value;
                color.addEventListener('input', () => {
                    value.textContent = color.value;
                    updateSkinPreview();
                });
                row.append(color, value);
                label.appendChild(row);
                skinColors.appendChild(label);
            });
        }

        function updateSkinPreview() {
            skinFields.forEach(([field]) => {
                const cssName = '--skin-' + field.replace(/[A-Z]/g, letter => '-' + letter.toLowerCase());
                skinPreview.style.setProperty(cssName, skinForm.elements[field].value);
            });
        }

        function populateSkinForm(skin = selectedSkin()) {
            skinForm.reset();
            skinForm.elements.name.value = skin.name + (customSkins.includes(skin) ? '' : ' Custom');
            skinFields.forEach(([field]) => { skinForm.elements[field].value = skin[field]; });
            deleteSkinButton.classList.toggle('hidden', !customSkins.includes(skin));
            skinStatus.textContent = '';
            updateSkinPreview();
        }

        async function loadSkins() {
            let preferredId = builtInSkins[0].id;
            try { preferredId = localStorage.getItem(skinStorageKey) || preferredId; } catch (_) {}
            renderSkinOptions(preferredId);
            try {
                const response = await fetch('/api/skins', {cache: 'no-store'});
                if (!response.ok) return;
                const payload = await response.json();
                customSkins = Array.isArray(payload.skins) ? payload.skins : [];
                renderSkinOptions(preferredId);
            } catch (_) {
                console.info('Custom skins are unavailable on this server.');
            }
        }

        function appendDetail(details, className, text) {
            if (!text) return;
            const detail = document.createElement('span');
            detail.className = 'detail ' + className;
            detail.textContent = text;
            if (text === 'UHD BD 4k' || text === 'Plex 4k') {
                detail.style.color = 'var(--skin-accent)';
                detail.style.fontWeight = '700';
            }
            details.appendChild(detail);
        }

        function renderMovies(movies) {
            const fragment = document.createDocumentFragment();
            movies.forEach(movie => {
                const card = document.createElement('article');
                card.className = 'movie-card';
                Object.assign(card.dataset, {
                    title: movie.title, category: movie.category, format: movie.format,
                    hdr: movie.hdr, audio: movie.audio, family: String(movie.family), order: String(movie.order)
                });
                card.searchableText = [movie.title, movie.category, movie.format, movie.hdr, movie.audio]
                    .filter(Boolean)
                    .join(' ')
                    .toLowerCase();
                const poster = document.createElement('img');
                poster.className = 'poster';
                poster.src = movie.poster;
                poster.alt = movie.posterAlt || movie.title;
                poster.loading = 'lazy';
                poster.decoding = 'async';
                if (movie.posterWidth && movie.posterHeight) {
                    poster.width = movie.posterWidth;
                    poster.height = movie.posterHeight;
                }
                const info = document.createElement('div');
                info.className = 'movie-info';
                const title = document.createElement('div');
                title.className = 'movie-title';
                title.textContent = movie.title;
                const details = document.createElement('div');
                details.className = 'movie-details';
                info.append(title, details);
                card.append(poster, info);
                appendDetail(details, 'format', movie.format);
                appendDetail(details, 'hdr', movie.hdr);
                appendDetail(details, 'audio', movie.audio);
                appendDetail(details, 'duration', movie.duration);
                if (movie.family) {
                    const badge = document.createElement('span');
                    badge.className = 'detail family-detail';
                    badge.title = 'Stevie Approved';
                    const image = document.createElement('img');
                    image.src = 'assets/stevie-approved.png';
                    image.alt = 'Stevie Approved';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    badge.appendChild(image);
                    details.appendChild(badge);
                }
                fragment.appendChild(card);
            });
            grid.replaceChildren(fragment);
            cards = Array.from(grid.querySelectorAll('.movie-card'));
        }

        function setFilterValues(select, values) {
            const selected = select.value;
            select.querySelectorAll('option:not(:first-child)').forEach(option => option.remove());
            const unique = [...new Set(values.filter(v => v !== ''))].sort((a,b) => a.localeCompare(b));
            unique.forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value;
                select.appendChild(option);
            });
            select.value = unique.includes(selected) ? selected : '';
        }

        function setDatalistValues(id, values) {
            const datalist = document.getElementById(id);
            const fragment = document.createDocumentFragment();
            [...new Set(values.filter(Boolean))]
                .sort((a, b) => a.localeCompare(b))
                .forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    fragment.appendChild(option);
                });
            datalist.replaceChildren(fragment);
        }

        function refreshCatalog() {
            renderMovies(catalog);
            setFilterValues(categoryFilter, cards.map(card => card.dataset.category));
            setFilterValues(formatFilter, cards.map(card => card.dataset.format));
            setFilterValues(hdrFilter, cards.map(card => card.dataset.hdr));
            setFilterValues(audioFilter, cards.map(card => card.dataset.audio));
            setDatalistValues('formatOptions', catalog.map(movie => movie.format));
            setDatalistValues('hdrOptions', catalog.map(movie => movie.hdr));
            setDatalistValues('audioOptions', catalog.map(movie => movie.audio));
            sortCards();
            applyFilters();
        }

        function applyFilters() {
            const query = search.value.trim().toLowerCase();
            const category = categoryFilter.value;
            const format = formatFilter.value;
            const hdr = hdrFilter.value;
            const audio = audioFilter.value;
            const familyOnly = familyFilter.classList.contains('active');
            let visible = 0;
            cards.forEach(card => {
                const show = (!query || card.searchableText.includes(query)) && (!category || card.dataset.category === category) && (!format || card.dataset.format === format) && (!hdr || card.dataset.hdr === hdr) && (!audio || card.dataset.audio === audio) && (!familyOnly || card.dataset.family === 'true');
                card.classList.toggle('hidden', !show);
                if (show) visible++;
            });
            count.textContent = visible + ' of ' + cards.length + ' titles';
        }

        function sortCards() {
            const mode = sortSelect.value;
            const sorted = [...cards];
            const compare = (a, b, field) => a.dataset[field].localeCompare(b.dataset[field], undefined, {sensitivity:'base'}) || Number(a.dataset.order) - Number(b.dataset.order);
            sorted.sort((a, b) => {
                if (mode === 'order') return Number(a.dataset.order) - Number(b.dataset.order);
                if (mode === 'titleAsc') return compare(a, b, 'title');
                if (mode === 'titleDesc') return compare(b, a, 'title');
                return compare(a, b, mode);
            });
            sorted.forEach(card => grid.appendChild(card));
        }

        function showNotice(message, isError = false) {
            window.clearTimeout(noticeTimer);
            notice.textContent = message;
            notice.classList.toggle('error', isError);
            noticeTimer = window.setTimeout(() => {
                notice.textContent = '';
                notice.classList.remove('error');
            }, 6000);
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const objectUrl = URL.createObjectURL(file);
                image.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(image);
                };
                image.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('The selected poster could not be read.'));
                };
                image.src = objectUrl;
            });
        }

        async function optimizePoster(file) {
            const image = await loadImage(file);
            const scale = Math.min(1, 640 / image.naturalWidth, 960 / image.naturalHeight);
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.fillStyle = '#111';
            context.fillRect(0, 0, width, height);
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(image, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        function tmdbPosterUrl(path) {
            return `/api/tmdb/poster?path=${encodeURIComponent(path)}`;
        }

        function createTmdbPoster(path, title) {
            if (!path) {
                const placeholder = document.createElement('span');
                placeholder.className = 'tmdb-poster-placeholder';
                placeholder.textContent = 'No poster';
                return placeholder;
            }
            const image = document.createElement('img');
            image.src = tmdbPosterUrl(path);
            image.alt = `${title} poster`;
            image.loading = 'lazy';
            return image;
        }

        function clearTmdbSelection() {
            selectedTmdbTitle = null;
            tmdbSelected.replaceChildren();
            tmdbSelected.classList.add('hidden');
        }

        function renderTmdbResults(results) {
            const fragment = document.createDocumentFragment();
            results.forEach(result => {
                const button = document.createElement('button');
                button.className = 'tmdb-result';
                button.type = 'button';
                button.appendChild(createTmdbPoster(result.posterPath, result.title));

                const copy = document.createElement('span');
                const title = document.createElement('strong');
                title.className = 'tmdb-result-title';
                title.textContent = result.title;
                const meta = document.createElement('small');
                meta.className = 'tmdb-result-meta';
                meta.textContent = [result.category, result.year].filter(Boolean).join(' · ');
                copy.append(title, meta);
                button.appendChild(copy);
                button.addEventListener('click', () => selectTmdbTitle(result));
                fragment.appendChild(button);
            });
            tmdbResults.replaceChildren(fragment);
        }

        async function searchTmdb() {
            const query = tmdbSearchInput.value.trim();
            if (query.length < 2) {
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = 'Enter at least two characters.';
                return;
            }
            tmdbSearchController?.abort();
            tmdbSearchController = new AbortController();
            tmdbSearchButton.disabled = true;
            tmdbSearchStatus.textContent = 'Searching TMDB...';
            try {
                const response = await fetch(`/api/tmdb/search?q=${encodeURIComponent(query)}`, {
                    cache: 'no-store',
                    signal: tmdbSearchController.signal
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'TMDB search failed.');
                renderTmdbResults(payload.results || []);
                tmdbSearchStatus.textContent = payload.results?.length
                    ? `${payload.results.length} match${payload.results.length === 1 ? '' : 'es'} found.`
                    : 'No matching movies or series found.';
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error(error);
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = error.message || 'TMDB search failed.';
            } finally {
                tmdbSearchButton.disabled = tmdbSearchInput.disabled;
            }
        }

        async function selectTmdbTitle(result) {
            tmdbSearchController?.abort();
            tmdbDetailController?.abort();
            tmdbDetailController = new AbortController();
            tmdbSearchStatus.textContent = `Loading ${result.title}...`;
            try {
                const response = await fetch(`/api/tmdb/title/${result.mediaType}/${result.id}`, {
                    cache: 'no-store',
                    signal: tmdbDetailController.signal
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'TMDB title details could not be loaded.');
                selectedTmdbTitle = payload.title;
                addTitleForm.elements.title.value = payload.title.title;
                addTitleForm.elements.category.value = payload.title.category;
                addTitleForm.elements.duration.value = payload.title.duration;

                const poster = createTmdbPoster(payload.title.posterPath, payload.title.title);
                const copy = document.createElement('span');
                const title = document.createElement('strong');
                title.textContent = payload.title.title;
                const meta = document.createElement('small');
                meta.textContent = [payload.title.category, payload.title.year, payload.title.duration]
                    .filter(Boolean)
                    .join(' · ');
                copy.append(title, meta);
                if (payload.title.overview) {
                    const overview = document.createElement('small');
                    overview.textContent = payload.title.overview;
                    copy.appendChild(overview);
                }
                const change = document.createElement('button');
                change.type = 'button';
                change.textContent = 'Change';
                change.addEventListener('click', () => {
                    clearTmdbSelection();
                    tmdbSearchStatus.textContent = 'Search TMDB to fill in title details and a poster.';
                    tmdbSearchInput.focus();
                });
                tmdbSelected.replaceChildren(poster, copy, change);
                tmdbSelected.classList.remove('hidden');
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = 'TMDB title selected. Add details about your copy below.';
                addTitleForm.elements.format.focus();
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error(error);
                tmdbSearchStatus.textContent = error.message || 'TMDB title details could not be loaded.';
            }
        }

        function resetAddTitleForm() {
            addTitleForm.reset();
            setFamilyApproved(false);
            clearTmdbSelection();
            tmdbResults.replaceChildren();
            tmdbSearchInput.value = '';
            tmdbSearchStatus.textContent = tmdbSearchInput.disabled
                ? 'Set TMDB_READ_TOKEN and restart the server to enable search.'
                : 'Search TMDB to fill in title details and a poster.';
        }

        function setFamilyApproved(isApproved) {
            familyField.value = String(isApproved);
            familyToggle.setAttribute('aria-pressed', String(isApproved));
            familyToggle.title = isApproved
                ? 'Stevie Approved — click to remove approval'
                : 'Mark as Stevie Approved';
        }

        async function posterDataForSubmission(posterFile) {
            if (posterFile instanceof File && posterFile.size > 0) {
                return optimizePoster(posterFile);
            }
            if (!selectedTmdbTitle?.posterPath) {
                throw new Error('Choose a poster file or select a TMDB title that has a poster.');
            }
            const response = await fetch(tmdbPosterUrl(selectedTmdbTitle.posterPath), {cache: 'no-store'});
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.error || 'The TMDB poster could not be downloaded.');
            }
            return optimizePoster(await response.blob());
        }

        async function checkEditingAvailability() {
            try {
                const response = await fetch('/api/status', {cache: 'no-store'});
                if (!response.ok) return;
                const status = await response.json();
                if (!status.catalogEditing) return;
                addTitleButton.disabled = false;
                addTitleButton.title = 'Add a movie or series';
                manageSkinsButton.disabled = false;
                manageSkinsButton.title = 'Create or remove custom skins';
                if (status.tmdbConfigured) {
                    tmdbSearchInput.disabled = false;
                    tmdbSearchButton.disabled = false;
                    tmdbSearchStatus.textContent = 'Search TMDB to fill in title details and a poster.';
                }
            } catch (error) {
                console.info('Catalog editing is unavailable on this server.');
            }
        }

        search.addEventListener('input', applyFilters);
        skinSelect.addEventListener('change', () => applySkin(selectedSkin()));
        manageSkinsButton.addEventListener('click', () => {
            populateSkinForm();
            skinDialog.showModal();
            queueMicrotask(() => skinForm.elements.name.focus());
        });
        [closeSkinDialog, cancelSkinDialog].forEach(button => {
            button.addEventListener('click', () => skinDialog.close());
        });
        skinDialog.addEventListener('click', event => {
            if (event.target === skinDialog) skinDialog.close();
        });
        skinForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (!skinForm.reportValidity()) return;
            const data = new FormData(skinForm);
            const skin = {name: data.get('name')};
            skinFields.forEach(([field]) => { skin[field] = data.get(field); });
            skinStatus.textContent = 'Saving skin...';
            try {
                const response = await fetch('/api/skins', {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(skin)
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'The skin could not be saved.');
                customSkins.push(payload.skin);
                renderSkinOptions(payload.skin.id);
                applySkin(payload.skin);
                skinDialog.close();
                showNotice(`${payload.skin.name} is now the active skin.`);
            } catch (error) {
                skinStatus.textContent = error.message || 'The skin could not be saved.';
            }
        });
        deleteSkinButton.addEventListener('click', async () => {
            const skin = selectedSkin();
            if (!customSkins.includes(skin) || !confirm(`Delete the ${skin.name} skin?`)) return;
            skinStatus.textContent = 'Deleting skin...';
            try {
                const response = await fetch(`/api/skins/${encodeURIComponent(skin.id)}`, {method: 'DELETE'});
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'The skin could not be deleted.');
                customSkins = customSkins.filter(item => item.id !== skin.id);
                renderSkinOptions(builtInSkins[0].id);
                applySkin(builtInSkins[0]);
                skinDialog.close();
                showNotice(`${skin.name} was deleted.`);
            } catch (error) {
                skinStatus.textContent = error.message || 'The skin could not be deleted.';
            }
        });
        [categoryFilter, formatFilter, hdrFilter, audioFilter].forEach(element => {
            element.addEventListener('change', applyFilters);
        });
        sortSelect.addEventListener('change', () => {
            sortCards();
            applyFilters();
        });
        familyFilter.addEventListener('click', () => {
            const active = familyFilter.classList.toggle('active');
            familyFilter.setAttribute('aria-pressed', active ? 'true' : 'false');
            applyFilters();
        });
        familyToggle.addEventListener('click', () => {
            setFamilyApproved(familyToggle.getAttribute('aria-pressed') !== 'true');
        });
        sizeSlider.addEventListener('input', () => {
            const size = sizeSlider.value;
            grid.style.setProperty('--poster-size', size + 'px');
            sizeValue.textContent = size + 'px';
        });
        addTitleButton.addEventListener('click', () => {
            addTitleStatus.textContent = '';
            addTitleDialog.showModal();
            queueMicrotask(() => (tmdbSearchInput.disabled
                ? addTitleForm.elements.title
                : tmdbSearchInput).focus());
        });
        [closeAddTitle, cancelAddTitle].forEach(button => {
            button.addEventListener('click', () => addTitleDialog.close());
        });
        addTitleDialog.addEventListener('click', event => {
            if (event.target === addTitleDialog) addTitleDialog.close();
        });
        addTitleDialog.addEventListener('close', () => {
            window.clearTimeout(tmdbSearchTimer);
            tmdbSearchController?.abort();
            tmdbDetailController?.abort();
            addTitleStatus.textContent = '';
            resetAddTitleForm();
        });
        tmdbSearchButton.addEventListener('click', searchTmdb);
        tmdbSearchInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') {
                event.preventDefault();
                window.clearTimeout(tmdbSearchTimer);
                searchTmdb();
            }
        });
        tmdbSearchInput.addEventListener('input', () => {
            window.clearTimeout(tmdbSearchTimer);
            if (tmdbSearchInput.value.trim().length < 2) {
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = 'Enter at least two characters.';
                return;
            }
            tmdbSearchTimer = window.setTimeout(searchTmdb, 350);
        });
        addTitleForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (!addTitleForm.reportValidity()) return;

            const fields = new FormData(addTitleForm);
            const posterFile = fields.get('poster');
            saveTitleButton.disabled = true;
            saveTitleButton.textContent = 'Saving...';
            addTitleStatus.textContent = 'Optimizing poster...';
            try {
                const posterData = await posterDataForSubmission(posterFile);
                addTitleStatus.textContent = 'Saving title...';
                const response = await fetch('/api/movies', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        title: fields.get('title'),
                        category: fields.get('category'),
                        format: fields.get('format'),
                        hdr: fields.get('hdr'),
                        audio: fields.get('audio'),
                        duration: fields.get('duration'),
                        family: fields.get('family') === 'true',
                        tmdbType: selectedTmdbTitle?.mediaType,
                        tmdbId: selectedTmdbTitle?.id,
                        posterData
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'The title could not be saved.');
                catalog.push(result.movie);
                refreshCatalog();
                resetAddTitleForm();
                addTitleDialog.close();
                showNotice(`${result.movie.title} was added to the library.`);
            } catch (error) {
                console.error(error);
                addTitleStatus.textContent = error.message || 'The title could not be saved.';
            } finally {
                saveTitleButton.disabled = false;
                saveTitleButton.textContent = 'Add title';
            }
        });

        async function loadCatalog() {
            count.textContent = 'Loading titles...';
            try {
                const response = await fetch('movies.json');
                if (!response.ok) throw new Error(`Catalog request failed: ${response.status}`);
                catalog = await response.json();
                refreshCatalog();
            } catch (error) {
                console.error(error);
                count.textContent = 'Unable to load the catalog.';
                const message = document.createElement('p');
                message.textContent = location.protocol === 'file:'
                    ? 'Open this site through a local web server so it can load movies.json.'
                    : 'The movie catalog could not be loaded.';
                grid.replaceChildren(message);
            }
        }

        buildSkinFields();
        loadSkins();
        loadCatalog();
        checkEditingAvailability();
    </script>
</body>
</html>
