<!DOCTYPE html>
<html lang="en" data-skin="shrek">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanford Library</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --skin-background: #10180d;
            --skin-surface: #20301d;
            --skin-surface-alt: #39482a;
            --skin-text: #f5efcb;
            --skin-muted: #c4c79c;
            --skin-border: #748c40;
            --skin-accent: #b7ce63;
            --skin-accent-text: #18210f;
            --skin-font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
            --skin-font-size: 15px;
            --skin-font-weight: 500;
            --skin-spacing: 16px;
            --skin-content-width: 1800px;
            --skin-control-height: 40px;
            --skin-grid-gap: 18px;
            --skin-radius: 14px;
            --skin-shadow: 0 18px 60px rgba(0,0,0,.75);
            --skin-backdrop: rgba(8,12,6,.82);
            --skin-scrollbar-width: 12px;
            --skin-scrollbar-track: #20301d;
            --skin-scrollbar-thumb: #748c40;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #10180d;
            color: #f5efcb;
            font-family: var(--skin-font-family);
            font-size: var(--skin-font-size);
            font-weight: var(--skin-font-weight);
        }
        body { min-height: 100vh; }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(16,24,13,.96);
            border-bottom: 1px solid #748c40;
            padding: var(--skin-spacing);
            backdrop-filter: blur(8px);
        }
        .header-inner {
            max-width: var(--skin-content-width);
            margin: 0 auto;
        }
        h1 {
            margin: 0;
            font-size: 28px;
        }
        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--skin-spacing);
            margin-bottom: 14px;
        }
        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(110px, 1fr)) auto;
            gap: 8px;
        }
        input, select {
            width: 100%;
            min-height: var(--skin-control-height);
            padding: 8px 10px;
            border-radius: var(--skin-radius);
            border: 1px solid #444;
            background: #222;
            color: #eee;
            font-size: 14px;
        }
        button {
            min-height: var(--skin-control-height);
            padding: 8px 12px;
            border-radius: var(--skin-radius);
            border: 1px solid #555;
            background: #292929;
            color: #eee;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #353535; }
        button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid #d6a84f;
            outline-offset: 2px;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: .45;
        }
        .add-title-button {
            flex: 0 0 auto;
            border-color: #9b7430;
            background: #5b421c;
            font-weight: 700;
        }
        .add-title-button:hover:not(:disabled) { background: #725324; }
        .family-filter {
            min-width: 42px;
            width: 42px;
            height: 38px;
            padding: 4px;
            border-radius: var(--skin-radius);
            border: 1px solid #444;
            background: #222;
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .family-filter img {
            display: block;
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .family-filter.active {
            border-color: #d6a84f;
            background: #332a18;
            box-shadow: 0 0 0 1px #d6a84f;
        }
        .size-control {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .size-control input { width: 220px; }
        .size-value {
            min-width: 55px;
            color: #aaa;
        }
        .count {
            margin-top: 8px;
            color: #999;
            font-size: 13px;
        }
        .notice {
            min-height: 18px;
            margin-top: 5px;
            color: #8fcf8f;
            font-size: 13px;
        }
        .notice.error { color: #ef8f8f; }
        .grid {
            max-width: var(--skin-content-width);
            margin: 0 auto;
            padding: calc(var(--skin-spacing) * 1.25) var(--skin-spacing) calc(var(--skin-spacing) * 2.5);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--poster-size), 1fr));
            gap: calc(var(--skin-grid-gap) * 1.5) var(--skin-grid-gap);
        }
        .movie-card {
            min-width: 0;
        }
        .poster {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: #222;
            border-radius: var(--skin-radius);
            border: 1px solid transparent;
            box-shadow: var(--skin-shadow);
        }
        .poster-missing {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }
        .movie-info { padding-top: 8px; }
        .movie-title {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.2;
        }
        .movie-details {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 4px;
            margin-top: 5px;
        }
        .detail {
            font-size: 11px;
            color: #aaa;
            background: #222;
            border-radius: calc(var(--skin-radius) * .6);
            padding: 2px 4px;
        }
        .family-detail {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
        }
        .family-detail img {
            display: block;
            width: 22px;
            height: 22px;
            object-fit: contain;
        }
        dialog {
            width: min(680px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            padding: 0;
            overflow: auto;
            border: 1px solid #555;
            border-radius: calc(var(--skin-radius) * 1.67);
            background: #181818;
            color: #eee;
            box-shadow: var(--skin-shadow);
        }
        dialog::backdrop { background: var(--skin-backdrop); }
        .dialog-form { padding: calc(var(--skin-spacing) * 1.25); }
        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .dialog-header h2 {
            margin: 0;
            font-size: 22px;
        }
        #skinDialog {
            position: fixed;
            box-sizing: border-box;
            width: min(860px, calc(100vw - 24px));
            min-width: min(360px, calc(100vw - 24px));
            min-height: min(320px, calc(100vh - 24px));
            resize: both;
        }
        #skinDialog .dialog-header {
            cursor: move;
            touch-action: none;
            user-select: none;
        }
        #skinDialog .dialog-header:active { cursor: grabbing; }
        #skinDialog .dialog-close { cursor: pointer; }
        .skin-resize-handle {
            position: fixed;
            z-index: 2;
            width: 24px;
            min-height: 24px;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            cursor: nwse-resize;
            touch-action: none;
        }
        .skin-resize-handle::after {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 10px;
            height: 10px;
            border-right: 2px solid var(--skin-muted);
            border-bottom: 2px solid var(--skin-muted);
            content: '';
        }
        .skin-resize-handle:hover:not(:disabled) { background: transparent; }
        .dialog-drag-hint {
            margin: 2px 0 0;
            color: var(--skin-muted);
            font-size: 11px;
            font-weight: 400;
        }
        .dialog-close {
            width: 38px;
            padding: 0;
            font-size: 22px;
            line-height: 1;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .tmdb-panel {
            grid-column: 1 / -1;
            padding: 14px;
            border: 1px solid #3c5363;
            border-radius: 8px;
            background: #14202a;
        }
        .tmdb-search-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
        }
        .tmdb-results {
            display: grid;
            gap: 8px;
            max-height: 310px;
            margin-top: 10px;
            overflow: auto;
        }
        .tmdb-result {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            gap: 10px;
            width: 100%;
            min-height: 76px;
            padding: 7px;
            text-align: left;
            background: #1d2a34;
        }
        .tmdb-result:hover:not(:disabled) { background: #293945; }
        .tmdb-result img,
        .tmdb-poster-placeholder {
            display: grid;
            place-items: center;
            width: 48px;
            height: 72px;
            border-radius: 3px;
            background: #293945;
            object-fit: cover;
            color: #81909a;
            font-size: 10px;
            text-align: center;
        }
        .tmdb-result-title {
            display: block;
            margin: 4px 0 5px;
            font-weight: 700;
        }
        .tmdb-result-meta {
            display: block;
            color: #9fb0bc;
            font-size: 12px;
        }
        .tmdb-selected {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #4d758c;
            border-radius: 7px;
            background: #1d2a34;
        }
        .tmdb-selected img,
        .tmdb-selected .tmdb-poster-placeholder {
            width: 64px;
            height: 96px;
            border-radius: 4px;
            object-fit: cover;
        }
        .tmdb-selected strong,
        .tmdb-selected small { display: block; }
        .tmdb-selected small { margin-top: 4px; color: #9fb0bc; font-size: 12px; }
        .manual-fields-label {
            grid-column: 1 / -1;
            margin: 2px 0 -4px;
            color: #aaa;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .form-field {
            display: grid;
            gap: 6px;
            color: #ccc;
            font-size: 13px;
        }
        .form-field.full { grid-column: 1 / -1; }
        .family-toggle-field {
            display: flex;
            align-items: center;
            min-height: 74px;
        }
        .family-toggle {
            width: 68px;
            height: 68px;
            min-height: 0;
            padding: 4px;
            border-color: #555;
            background: #222;
        }
        .family-toggle img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: grayscale(1);
            opacity: .35;
            transition: filter .15s ease, opacity .15s ease;
        }
        .family-toggle[aria-pressed="true"] {
            border-color: #d6a84f;
            background: #332a18;
        }
        .family-toggle[aria-pressed="true"] img {
            filter: none;
            opacity: 1;
        }
        .form-hint {
            color: #888;
            font-size: 12px;
        }
        .form-status {
            min-height: 20px;
            margin-top: 14px;
            color: #ef8f8f;
            font-size: 13px;
        }
        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .primary-button {
            border-color: #9b7430;
            background: #5b421c;
            font-weight: 700;
        }
        .tmdb-attribution {
            max-width: var(--skin-content-width);
            margin: 0 auto;
            padding: 0 16px 24px;
            color: #777;
            font-size: 11px;
            text-align: center;
        }
        .tmdb-attribution a { color: inherit; }
        .tmdb-attribution img {
            display: block;
            width: 90px;
            height: auto;
            margin: 0 auto 7px;
        }
        .title-actions { display: flex; align-items: center; gap: 8px; }
        .skin-picker { width: auto; min-width: 130px; }
        .skin-button {
            display: inline-grid;
            width: var(--skin-control-height);
            min-width: var(--skin-control-height);
            padding: 0;
            place-items: center;
        }
        .skin-button span { font-size: 20px; line-height: 1; }
        .skin-colors {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .skin-section {
            margin: 16px 0 0;
            padding: 12px;
            border: 1px solid var(--skin-border);
            border-radius: var(--skin-radius);
        }
        .skin-section legend { padding: 0 6px; font-weight: 700; }
        .skin-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .range-field { display: grid; grid-template-columns: minmax(0, 1fr) 54px; align-items: center; gap: 8px; }
        .range-field output { color: var(--skin-muted); text-align: right; }
        .skin-image-control { display: grid; gap: 6px; }
        .skin-image-control input[type="file"] { height: auto; padding: 6px; }
        .skin-image-path-row { display: flex; align-items: center; gap: 6px; }
        .skin-image-path-row input { min-width: 0; }
        .skin-image-clear { flex: 0 0 auto; min-height: var(--skin-control-height); }
        .skin-image-status { color: var(--skin-muted); font-size: 11px; overflow-wrap: anywhere; }
        .brand-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .header-image { display: none; max-width: 160px; height: 40px; object-fit: contain; }
        * { scrollbar-color: var(--skin-scrollbar-thumb) var(--skin-scrollbar-track); scrollbar-width: auto; }
        *::-webkit-scrollbar { width: var(--skin-scrollbar-width); height: var(--skin-scrollbar-width); }
        *::-webkit-scrollbar-track { background: var(--skin-scrollbar-track); }
        *::-webkit-scrollbar-thumb { background: var(--skin-scrollbar-thumb); border-radius: var(--skin-radius); }
        .color-field {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            align-items: center;
            gap: 9px;
        }
        .color-field input[type="color"] { width: 42px; height: 38px; padding: 3px; }
        .danger-button { border-color: #a84b4b; color: #ffb0b0; }

        html, body { background: var(--skin-background); color: var(--skin-text); }
        .header { background: color-mix(in srgb, var(--skin-background) 96%, transparent); border-color: var(--skin-border); }
        input, select, button, .family-filter, .family-toggle { background: var(--skin-surface-alt); color: var(--skin-text); border-color: var(--skin-border); }
        button:hover:not(:disabled) { background: color-mix(in srgb, var(--skin-surface-alt) 82%, var(--skin-text)); }
        button:focus-visible, input:focus-visible, select:focus-visible { outline-color: var(--skin-accent); }
        .add-title-button, .primary-button { background: var(--skin-accent); border-color: var(--skin-accent); color: var(--skin-accent-text); }
        .add-title-button:hover:not(:disabled), .primary-button:hover:not(:disabled) { background: color-mix(in srgb, var(--skin-accent) 82%, white); }
        .count, .size-value, .detail, .manual-fields-label, .form-hint, .tmdb-attribution { color: var(--skin-muted); }
        .detail, .poster { background: var(--skin-surface-alt); }
        dialog { background: var(--skin-surface); color: var(--skin-text); border-color: var(--skin-border); }
        .form-field { color: var(--skin-text); }
        .family-filter.active, .family-toggle[aria-pressed="true"] { border-color: var(--skin-accent); box-shadow: 0 0 0 1px var(--skin-accent); }
        html[data-skin="shrek"] body {
            background-color: var(--skin-background);
            background-image: url("assets/shrek-swamp.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        html[data-skin="shrek"] .header {
            background:
                linear-gradient(90deg, rgba(16,24,13,.98), rgba(32,48,29,.92)),
                repeating-linear-gradient(105deg, transparent 0 22px, rgba(183,206,99,.04) 23px 24px);
            border-bottom-width: 2px;
            box-shadow: 0 8px 28px rgba(0,0,0,.45);
        }
        html[data-skin="shrek"] .brand-title::before {
            content: '\1F9C5';
            display: grid;
            width: 42px;
            height: 42px;
            border: 2px solid var(--skin-accent);
            border-radius: 50% 44% 50% 42%;
            background: #ece2a6;
            color: #67572c;
            font-size: 25px;
            line-height: 1;
            place-items: center;
            box-shadow: inset 0 -5px 8px rgba(80,65,20,.25), 0 4px 12px rgba(0,0,0,.35);
            transform: rotate(-6deg);
        }
        html[data-skin="shrek"] h1 {
            color: #d9e98d;
            font-family: Georgia, "Times New Roman", serif;
            letter-spacing: .02em;
            text-shadow: 0 2px 0 #29351a, 0 4px 14px rgba(0,0,0,.75);
        }
        html[data-skin="shrek"] .brand-title::after {
            align-self: flex-end;
            margin: 0 0 3px -3px;
            color: var(--skin-muted);
            content: "Welcome to the swamp";
            font-family: Georgia, "Times New Roman", serif;
            font-size: 12px;
            font-style: italic;
            white-space: nowrap;
        }
        html[data-skin="shrek"] input,
        html[data-skin="shrek"] select,
        html[data-skin="shrek"] button,
        html[data-skin="shrek"] .family-filter,
        html[data-skin="shrek"] .family-toggle {
            border-width: 2px;
            box-shadow: inset 0 1px rgba(255,255,255,.08), 0 3px 9px rgba(0,0,0,.2);
        }
        html[data-skin="shrek"] input[type="range"] { accent-color: var(--skin-accent); }
        html[data-skin="shrek"] .movie-card {
            padding: 8px;
            border: 1px solid color-mix(in srgb, var(--skin-border) 72%, transparent);
            border-radius: calc(var(--skin-radius) + 3px);
            background: color-mix(in srgb, var(--skin-surface) 86%, transparent);
            box-shadow: 0 12px 34px rgba(0,0,0,.48);
            backdrop-filter: blur(7px);
            transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
        }
        html[data-skin="shrek"] .movie-card:hover {
            border-color: var(--skin-accent);
            box-shadow: 0 18px 42px rgba(0,0,0,.58), 0 0 0 1px rgba(183,206,99,.2);
            transform: translateY(-3px);
        }
        html[data-skin="shrek"] .poster { border-color: rgba(217,233,141,.28); }
        html[data-skin="shrek"] .detail { border: 1px solid rgba(183,206,99,.18); }
        html[data-skin="shrek"] dialog { box-shadow: 0 28px 90px rgba(0,0,0,.78); }
        html[data-skin="shrek"] .tmdb-attribution {
            margin-top: 8px;
            padding-top: 14px;
            background: linear-gradient(transparent, rgba(16,24,13,.88));
        }
        .hidden { display: none !important; }
        @media (max-width: 900px) {
            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
            }
            .controls input[type="search"] {
                flex: 1 1 100%;
                width: 100%;
            }
        }
        @media (max-width: 500px) {
            .header {
                padding: 10px;
            }
            h1 {
                font-size: 24px;
            }
            .title-row { margin-bottom: 8px; }
            .title-row { align-items: flex-start; }
            html[data-skin="shrek"] .brand-title::before { display: none; }
            html[data-skin="shrek"] .brand-title::after { display: none; }
            .title-actions { flex-wrap: wrap; justify-content: flex-end; }
            .skin-picker { min-width: 112px; }
            .skin-button { width: 32px; min-width: 32px; min-height: 32px; padding: 0; }
            .add-title-button { min-height: 32px; padding: 5px 9px; }
            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 5px;
            }
            .controls input[type="search"] {
                flex: 1 1 100%;
                width: 100%;
                min-height: 29px;
                height: 29px;
                padding: 3px 8px;
                font-size: 13px;
            }
            #categoryFilter {
                width: 145px;
                flex: 0 0 145px;
            }
            #formatFilter {
                width: 130px;
                flex: 0 0 130px;
            }
            #hdrFilter {
                width: 105px;
                flex: 0 0 105px;
            }
            #audioFilter {
                width: 110px;
                flex: 0 0 110px;
            }
            #sortSelect {
                width: 145px;
                flex: 0 0 145px;
            }
            .family-filter {
                min-width: 34px;
                width: 34px;
                height: 29px;
                padding: 2px;
                border-radius: 5px;
            }
            .family-filter img {
                width: 23px;
                height: 23px;
            }
            .controls select {
                min-height: 29px;
                height: 29px;
                padding: 3px 24px 3px 7px;
                border-radius: 5px;
                font-size: 13px;
            }
            .size-control {
                margin-top: 8px;
                gap: 7px;
            }
            .size-control input {
                width: auto;
                flex: 1;
            }
            .count {
                margin-top: 5px;
            }
            .grid {
                gap: 18px 10px;
                padding: 14px 10px 30px;
            }
            .dialog-form { padding: 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
            .skin-colors { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="title-row">
                <div class="brand-title"><img id="headerImage" class="header-image" alt=""><h1>Sanford Library</h1></div>
                <div class="title-actions">
                    <select id="skinSelect" class="skin-picker" aria-label="Interface skin"></select>
                    <button id="manageSkinsButton" class="skin-button" type="button" disabled title="Start server.py to add custom skins" aria-label="Manage skins">
                        <span aria-hidden="true">&#9881;</span>
                    </button>
                    <button id="addTitleButton" class="add-title-button" type="button" disabled title="Start server.py to enable catalog editing">+ Add title</button>
                </div>
            </div>
            <div class="controls">
                <input id="search" type="search" placeholder="Search title, category, format, HDR, audio...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <select id="formatFilter">
                    <option value="">All Formats</option>
                </select>

    <script>
        let cards = [];
        let catalog = [];
        let noticeTimer;
        let tmdbSearchTimer;
        let tmdbSearchController;
        let tmdbDetailController;
        let selectedTmdbTitle = null;
        let customSkins = [];
        const skinStorageKey = 'sanford-library-skin';
        const skinFields = [
            ['background', 'Page background'], ['surface', 'Panels'],
            ['surfaceAlt', 'Controls and tags'], ['text', 'Main text'],
            ['muted', 'Secondary text'], ['border', 'Borders'],
            ['accent', 'Accent'], ['accentText', 'Text on accent'],
            ['dialogBackdrop', 'Dialog backdrop'], ['scrollbarTrack', 'Scrollbar track'],
            ['scrollbarThumb', 'Scrollbar thumb']
        ];
        const skinDefaults = {
            fontFamily: 'system', fontSize: '14', fontWeight: '400', spacing: '16',
            contentWidth: '1800', controlHeight: '38', posterSize: '190', gridGap: '16',
            cornerRadius: '6', shadowStyle: 'soft', headerImage: '',
            familyIcon: 'assets/stevie-approved.png', dialogBackdrop: '#000000',
            backdropOpacity: '75', scrollbarWidth: '10', scrollbarTrack: '#181818',
            scrollbarThumb: '#444444', backgroundImage: '', backgroundSize: 'cover',
            backgroundPosition: 'center', backgroundAttachment: 'fixed'
        };
        const skinOptionGroups = [
            ['Typography', [
                {name: 'fontFamily', label: 'Font family', type: 'select', options: [['system', 'System sans-serif'], ['serif', 'Serif'], ['monospace', 'Monospace'], ['rounded', 'Rounded sans-serif']]},
                {name: 'fontSize', label: 'Base font size', type: 'range', min: 12, max: 20, suffix: 'px'},
                {name: 'fontWeight', label: 'Base font weight', type: 'select', options: [['300', 'Light'], ['400', 'Regular'], ['500', 'Medium'], ['600', 'Semibold'], ['700', 'Bold'], ['800', 'Extra bold']]}
            ]],
            ['Layout', [
                {name: 'spacing', label: 'Spacing', type: 'range', min: 8, max: 32, suffix: 'px'},
                {name: 'contentWidth', label: 'Maximum content width', type: 'range', min: 900, max: 2400, step: 50, suffix: 'px'},
                {name: 'controlHeight', label: 'Control height', type: 'range', min: 30, max: 56, suffix: 'px'},
                {name: 'posterSize', label: 'Default poster size', type: 'range', min: 120, max: 320, step: 10, suffix: 'px'},
                {name: 'gridGap', label: 'Grid gap', type: 'range', min: 4, max: 40, suffix: 'px'}
            ]],
            ['Shape and depth', [
                {name: 'cornerRadius', label: 'Corner radius', type: 'range', min: 0, max: 24, suffix: 'px'},
                {name: 'shadowStyle', label: 'Shadows', type: 'select', options: [['none', 'None'], ['soft', 'Soft'], ['deep', 'Deep']]}
            ]],
            ['Images', [
                {name: 'headerImage', label: 'Header image', type: 'image', placeholder: 'Or enter an image URL or app path'},
                {name: 'familyIcon', label: 'Family icon', type: 'image', placeholder: 'Or enter an image URL or app path'},
                {name: 'backgroundImage', label: 'Background image', type: 'image', placeholder: 'Or enter an image URL or app path'},
                {name: 'backgroundSize', label: 'Background sizing', type: 'select', options: [['cover', 'Cover'], ['contain', 'Contain'], ['auto', 'Original size']]},
                {name: 'backgroundPosition', label: 'Background position', type: 'select', options: [['center', 'Center'], ['top', 'Top'], ['bottom', 'Bottom']]},
                {name: 'backgroundAttachment', label: 'Background scrolling', type: 'select', options: [['fixed', 'Fixed'], ['scroll', 'Scroll with page']]}
            ]],
            ['Dialog and scrollbars', [
                {name: 'backdropOpacity', label: 'Backdrop opacity', type: 'range', min: 0, max: 100, suffix: '%'},
                {name: 'scrollbarWidth', label: 'Scrollbar width', type: 'range', min: 6, max: 20, suffix: 'px'}
            ]]
        ];
        const builtInSkins = [
            {...skinDefaults, id: 'shrek', name: "Shrek's Swamp", background: '#10180d', surface: '#20301d', surfaceAlt: '#39482a', text: '#f5efcb', muted: '#c4c79c', border: '#748c40', accent: '#b7ce63', accentText: '#18210f', fontFamily: 'rounded', fontSize: '15', fontWeight: '500', controlHeight: '40', posterSize: '180', gridGap: '18', cornerRadius: '14', shadowStyle: 'deep', dialogBackdrop: '#080c06', backdropOpacity: '82', scrollbarWidth: '12', scrollbarTrack: '#20301d', scrollbarThumb: '#748c40', backgroundImage: 'assets/shrek-swamp.png'},
            {...skinDefaults, id: 'midnight', name: 'Midnight', background: '#111111', surface: '#181818', surfaceAlt: '#222222', text: '#eeeeee', muted: '#aaaaaa', border: '#444444', accent: '#d6a84f', accentText: '#111111'},
            {...skinDefaults, id: 'matinee', name: 'Matinee', background: '#f4efe4', surface: '#fffaf0', surfaceAlt: '#e8dfcf', text: '#27221b', muted: '#6f665a', border: '#b8aa96', accent: '#8a3d2f', accentText: '#ffffff', scrollbarTrack: '#e8dfcf', scrollbarThumb: '#b8aa96'},
            {...skinDefaults, id: 'deep-blue', name: 'Deep Blue', background: '#07141f', surface: '#0d2030', surfaceAlt: '#173247', text: '#e6f3fa', muted: '#9ab5c5', border: '#31566d', accent: '#55c2d9', accentText: '#051218', scrollbarTrack: '#0d2030', scrollbarThumb: '#31566d'}
        ];
        const search = document.getElementById('search');
        const categoryFilter = document.getElementById('categoryFilter');
        const formatFilter = document.getElementById('formatFilter');
        const hdrFilter = document.getElementById('hdrFilter');
        const audioFilter = document.getElementById('audioFilter');
        const sortSelect = document.getElementById('sortSelect');
        const familyFilter = document.getElementById('familyFilter');
        const grid = document.getElementById('grid');
        const count = document.getElementById('count');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const notice = document.getElementById('notice');
        const addTitleButton = document.getElementById('addTitleButton');
        const addTitleDialog = document.getElementById('addTitleDialog');
        const addTitleForm = document.getElementById('addTitleForm');
        const addTitleStatus = document.getElementById('addTitleStatus');
        const saveTitleButton = document.getElementById('saveTitleButton');
        const closeAddTitle = document.getElementById('closeAddTitle');
        const cancelAddTitle = document.getElementById('cancelAddTitle');
        const tmdbSearchInput = document.getElementById('tmdbSearchInput');
        const tmdbSearchButton = document.getElementById('tmdbSearchButton');
        const tmdbSearchStatus = document.getElementById('tmdbSearchStatus');
        const tmdbResults = document.getElementById('tmdbResults');
        const tmdbSelected = document.getElementById('tmdbSelected');
        const familyField = document.getElementById('familyField');
        const familyToggle = document.getElementById('familyToggle');
        const skinSelect = document.getElementById('skinSelect');
        const manageSkinsButton = document.getElementById('manageSkinsButton');
        const skinDialog = document.getElementById('skinDialog');
        const skinForm = document.getElementById('skinForm');
        const skinColors = document.getElementById('skinColors');
        const skinOptions = document.getElementById('skinOptions');
        const skinStatus = document.getElementById('skinStatus');
        const deleteSkinButton = document.getElementById('deleteSkinButton');
        const closeSkinDialog = document.getElementById('closeSkinDialog');
        const cancelSkinDialog = document.getElementById('cancelSkinDialog');
        const skinResizeHandle = document.getElementById('skinResizeHandle');
        const headerImage = document.getElementById('headerImage');
        const skinDialogHeader = skinDialog.querySelector('.dialog-header');
        const saveSkinButton = skinForm.querySelector('button[type="submit"]');
        const skinImageControls = new Map();
        const skinImageValues = new Map();
        let skinEditorOriginal = null;
        let keepSkinChangesOnClose = false;
        let skinDialogGeometry = null;
        let skinDialogDrag = null;
        let skinDialogResize = null;
        let pendingSkinImages = 0;

        function normalizeSkin(skin) {
            return {...skinDefaults, ...skin};
        }

        function allSkins() {
            return [...builtInSkins, ...customSkins];
        }

        function selectedSkin() {
            return allSkins().find(skin => skin.id === skinSelect.value) || builtInSkins[0];
        }

        function applySkin(skin, remember = true) {
            skin = normalizeSkin(skin);
            skinFields.forEach(([field]) => {
                const cssName = '--skin-' + field.replace(/[A-Z]/g, letter => '-' + letter.toLowerCase());
                document.documentElement.style.setProperty(cssName, skin[field]);
            });
            const fontFamilies = {
                system: 'Arial, Helvetica, sans-serif',
                serif: 'Georgia, Times New Roman, serif',
                monospace: 'Consolas, Monaco, monospace',
                rounded: 'Trebuchet MS, Arial Rounded MT Bold, sans-serif'
            };
            const shadows = {none: 'none', soft: '0 1px 5px rgba(0,0,0,.35)', deep: '0 18px 60px rgba(0,0,0,.75)'};
            const root = document.documentElement.style;
            root.setProperty('--skin-font-family', fontFamilies[skin.fontFamily]);
            root.setProperty('--skin-font-size', skin.fontSize + 'px');
            root.setProperty('--skin-font-weight', skin.fontWeight);
            root.setProperty('--skin-spacing', skin.spacing + 'px');
            root.setProperty('--skin-content-width', skin.contentWidth + 'px');
            root.setProperty('--skin-control-height', skin.controlHeight + 'px');
            root.setProperty('--skin-grid-gap', skin.gridGap + 'px');
            root.setProperty('--skin-radius', skin.cornerRadius + 'px');
            root.setProperty('--skin-shadow', shadows[skin.shadowStyle]);
            root.setProperty('--skin-backdrop', hexToRgba(skin.dialogBackdrop, Number(skin.backdropOpacity) / 100));
            root.setProperty('--skin-scrollbar-width', skin.scrollbarWidth + 'px');
            document.body.style.backgroundImage = skin.backgroundImage ? `url(${JSON.stringify(skin.backgroundImage)})` : 'none';
            document.body.style.backgroundSize = skin.backgroundSize;
            document.body.style.backgroundPosition = skin.backgroundPosition;
            document.body.style.backgroundAttachment = skin.backgroundAttachment;
            document.body.style.backgroundRepeat = skin.backgroundSize === 'cover' ? 'no-repeat' : 'repeat';
            headerImage.src = skin.headerImage || '';
            headerImage.style.display = skin.headerImage ? 'block' : 'none';
            document.querySelectorAll('.family-filter img, .family-toggle img, .family-detail img').forEach(image => {
                image.src = skin.familyIcon || 'assets/stevie-approved.png';
            });
            sizeSlider.value = skin.posterSize;
            grid.style.setProperty('--poster-size', skin.posterSize + 'px');
            sizeValue.textContent = skin.posterSize + 'px';
            document.documentElement.dataset.skin = skin.id;
            if (remember) {
                try { localStorage.setItem(skinStorageKey, skin.id); } catch (_) {}
            }
        }

        function hexToRgba(hex, opacity) {
            const value = Number.parseInt(hex.slice(1), 16);
            return `rgba(${value >> 16}, ${(value >> 8) & 255}, ${value & 255}, ${opacity})`;
        }

        function collectSkinFormValues() {
            const skin = {
                id: skinEditorOriginal?.id || selectedSkin().id,
                name: skinForm.elements.name.value
            };
            skinFields.forEach(([field]) => { skin[field] = skinForm.elements[field].value; });
            skinOptionGroups.flatMap(([, fields]) => fields).forEach(({name}) => {
                skin[name] = skinImageValues.has(name)
                    ? skinImageValues.get(name)
                    : skinForm.elements[name].value;
            });
            return skin;
        }

        function renderSkinOptions(preferredId) {
            const fragment = document.createDocumentFragment();
            const groups = [['Built-in', builtInSkins], ['Custom', customSkins]];
            groups.forEach(([label, skins]) => {
                if (!skins.length) return;
                const group = document.createElement('optgroup');
                group.label = label;
                skins.forEach(skin => {
                    const option = document.createElement('option');
                    option.value = skin.id;
                    option.textContent = skin.name;
                    group.appendChild(option);
                });
                fragment.appendChild(group);
            });
            skinSelect.replaceChildren(fragment);
            const available = allSkins().some(skin => skin.id === preferredId);
            skinSelect.value = available ? preferredId : builtInSkins[0].id;
            applySkin(selectedSkin(), false);
        }

        function buildSkinFields() {
            const defaults = builtInSkins[0];
            skinFields.forEach(([field, labelText]) => {
                const label = document.createElement('label');
                label.className = 'form-field';
                label.textContent = labelText;
                const row = document.createElement('span');
                row.className = 'color-field';
                const color = document.createElement('input');
                color.type = 'color';
                color.name = field;
                color.value = defaults[field];
                color.setAttribute('aria-label', labelText);
                const value = document.createElement('span');
                value.textContent = color.value;
                color.addEventListener('input', () => {
                    value.textContent = color.value;
                    updateLiveSkin();
                });
                row.append(color, value);
                label.appendChild(row);
                skinColors.appendChild(label);
            });
            skinOptionGroups.forEach(([legendText, fields]) => {
                const fieldset = document.createElement('fieldset');
                fieldset.className = 'skin-section';
                const legend = document.createElement('legend');
                legend.textContent = legendText;
                const options = document.createElement('div');
                options.className = 'skin-options';
                fields.forEach(config => {
                    const label = document.createElement(config.type === 'image' ? 'div' : 'label');
                    label.className = 'form-field';
                    if (config.type === 'image') {
                        const labelText = document.createElement('span');
                        labelText.textContent = config.label;
                        const control = document.createElement('span');
                        control.className = 'skin-image-control';
                        skinImageValues.set(config.name, skinDefaults[config.name]);
                        const file = document.createElement('input');
                        file.type = 'file';
                        file.accept = 'image/jpeg,image/png,image/webp';
                        file.setAttribute('aria-label', `Choose ${config.label.toLowerCase()} file`);
                        const pathRow = document.createElement('span');
                        pathRow.className = 'skin-image-path-row';
                        const path = document.createElement('input');
                        path.type = 'text';
                        path.maxLength = 500;
                        path.placeholder = config.placeholder;
                        path.setAttribute('aria-label', `${config.label} URL or app path`);
                        const clear = document.createElement('button');
                        clear.className = 'skin-image-clear';
                        clear.type = 'button';
                        clear.textContent = 'Clear';
                        const status = document.createElement('span');
                        status.className = 'skin-image-status';
                        status.textContent = 'No image selected.';
                        path.addEventListener('input', () => {
                            file.value = '';
                            const value = path.value.trim();
                            skinImageValues.set(config.name, value);
                            status.textContent = value ? `Using ${value}` : 'No image selected.';
                            clear.classList.toggle('hidden', !value);
                            updateLiveSkin();
                        });
                        file.addEventListener('change', async () => {
                            const selectedFile = file.files?.[0];
                            if (!selectedFile) return;
                            pendingSkinImages += 1;
                            saveSkinButton.disabled = true;
                            skinStatus.textContent = `Preparing ${config.label.toLowerCase()}...`;
                            try {
                                const imageData = await prepareSkinImage(selectedFile, config.name);
                                if (file.files?.[0] !== selectedFile) return;
                                skinImageValues.set(config.name, imageData);
                                path.value = '';
                                status.textContent = `Selected file: ${selectedFile.name}`;
                                clear.classList.remove('hidden');
                                updateLiveSkin();
                                skinStatus.textContent = '';
                            } catch (error) {
                                file.value = '';
                                skinStatus.textContent = error.message || 'The selected image could not be prepared.';
                            } finally {
                                pendingSkinImages -= 1;
                                saveSkinButton.disabled = pendingSkinImages > 0;
                            }
                        });
                        clear.addEventListener('click', () => {
                            file.value = '';
                            path.value = '';
                            skinImageValues.set(config.name, '');
                            status.textContent = 'No image selected.';
                            clear.classList.add('hidden');
                            updateLiveSkin();
                        });
                        pathRow.append(path, clear);
                        control.append(file, pathRow, status);
                        label.append(labelText, control);
                        skinImageControls.set(config.name, {file, path, clear, status});
                        options.appendChild(label);
                        return;
                    }
                    label.textContent = config.label;
                    let input;
                    if (config.type === 'select') {
                        input = document.createElement('select');
                        config.options.forEach(([value, text]) => input.add(new Option(text, value)));
                    } else {
                        input = document.createElement('input');
                        input.type = config.type;
                        if (config.type === 'range') {
                            input.min = config.min;
                            input.max = config.max;
                            input.step = config.step || 1;
                        } else {
                            input.maxLength = 500;
                            input.placeholder = config.placeholder || '';
                        }
                    }
                    input.name = config.name;
                    input.value = skinDefaults[config.name];
                    if (config.type === 'range') {
                        const row = document.createElement('span');
                        row.className = 'range-field';
                        const output = document.createElement('output');
                        const refreshOutput = () => { output.value = input.value + (config.suffix || ''); };
                        input.addEventListener('input', () => { refreshOutput(); updateLiveSkin(); });
                        refreshOutput();
                        row.append(input, output);
                        label.appendChild(row);
                    } else {
                        input.addEventListener('input', updateLiveSkin);
                        label.appendChild(input);
                    }
                    options.appendChild(label);
                });
                fieldset.append(legend, options);
                skinOptions.appendChild(fieldset);
            });
        }

        function updateLiveSkin() {
            applySkin(collectSkinFormValues(), false);
        }

        function populateSkinForm(skin = selectedSkin()) {
            skin = normalizeSkin(skin);
            skinForm.reset();
            skinForm.elements.name.value = skin.name + (customSkins.includes(skin) ? '' : ' Custom');
            skinFields.forEach(([field]) => {
                const input = skinForm.elements[field];
                input.value = skin[field];
                const value = input.parentElement.querySelector('span');
                if (value) value.textContent = input.value;
            });
            skinOptionGroups.flatMap(([, fields]) => fields).forEach(({name, suffix}) => {
                const imageControl = skinImageControls.get(name);
                if (imageControl) {
                    skinImageValues.set(name, skin[name]);
                    imageControl.file.value = '';
                    imageControl.path.value = skin[name];
                    imageControl.status.textContent = skin[name] ? `Using ${skin[name]}` : 'No image selected.';
                    imageControl.clear.classList.toggle('hidden', !skin[name]);
                    return;
                }
                skinForm.elements[name].value = skin[name];
                const output = skinForm.elements[name].parentElement.querySelector('output');
                if (output) output.value = skin[name] + (suffix || '');
            });
            deleteSkinButton.classList.toggle('hidden', !customSkins.includes(skin));
            skinStatus.textContent = '';
            updateLiveSkin();
        }

        function clampSkinDialogToViewport() {
            if (!skinDialog.open) return;
            const inset = 12;
            const rect = skinDialog.getBoundingClientRect();
            const width = Math.min(rect.width, Math.max(0, window.innerWidth - inset * 2));
            const height = Math.min(rect.height, Math.max(0, window.innerHeight - inset * 2));
            const left = Math.min(Math.max(inset, rect.left), Math.max(inset, window.innerWidth - width - inset));
            const top = Math.min(Math.max(inset, rect.top), Math.max(inset, window.innerHeight - height - inset));
            skinDialog.style.width = width + 'px';
            skinDialog.style.height = height + 'px';
            skinDialog.style.left = left + 'px';
            skinDialog.style.top = top + 'px';
            skinDialogGeometry = {left, top, width, height};
            const updatedRect = skinDialog.getBoundingClientRect();
            skinResizeHandle.style.left = (updatedRect.right - 24) + 'px';

                top: Math.max(inset, (window.innerHeight - rect.height) / 2),
                width: rect.width,
                height: rect.height
            };
            skinDialog.style.margin = '0';
            skinDialog.style.left = geometry.left + 'px';
            skinDialog.style.top = geometry.top + 'px';

        function applyFilters() {
            const query = search.value.trim().toLowerCase();
            const category = categoryFilter.value;
            const format = formatFilter.value;
            const hdr = hdrFilter.value;
            const audio = audioFilter.value;
            const familyOnly = familyFilter.classList.contains('active');
            let visible = 0;
            cards.forEach(card => {
                const show = (!query || card.searchableText.includes(query)) && (!category || card.dataset.category === category) && (!format || card.dataset.format === format) && (!hdr || card.dataset.hdr === hdr) && (!audio || card.dataset.audio === audio) && (!familyOnly || card.dataset.family === 'true');
                card.classList.toggle('hidden', !show);
                if (show) visible++;

        }

        function sortCards() {
            const mode = sortSelect.value;
            const sorted = [...cards];
            const compare = (a, b, field) => a.dataset[field].localeCompare(b.dataset[field], undefined, {sensitivity:'base'}) || Number(a.dataset.order) - Number(b.dataset.order);
            sorted.sort((a, b) => {
                if (mode === 'order') return Number(a.dataset.order) - Number(b.dataset.order);
                if (mode === 'titleAsc') return compare(a, b, 'title');
                if (mode === 'titleDesc') return compare(b, a, 'title');
                return compare(a, b, mode);
            });
            sorted.forEach(card => grid.appendChild(card));
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const objectUrl = URL.createObjectURL(file);
                image.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve(image);
                };
                image.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('The selected image could not be read.'));
                };
                image.src = objectUrl;
            });
        }

        async function prepareSkinImage(file, field) {
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                throw new Error('Choose a JPEG, PNG, or WebP image.');
            }
            if (file.size > 20 * 1024 * 1024) {
                throw new Error('Choose an image smaller than 20 MB.');
            }
            const image = await loadImage(file);
            const limits = {
                headerImage: [1600, 600],
                familyIcon: [512, 512],
                backgroundImage: [2560, 1440]
            };
            const [maximumWidth, maximumHeight] = limits[field];
            const scale = Math.min(1, maximumWidth / image.naturalWidth, maximumHeight / image.naturalHeight);
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            if (!context) throw new Error('The selected image could not be prepared.');
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(image, 0, 0, width, height);
            let imageData = canvas.toDataURL('image/webp', 0.86);
            if (!imageData.startsWith('data:image/webp')) imageData = canvas.toDataURL('image/png');
            if (imageData.length * 0.75 > 4 * 1024 * 1024) {
                throw new Error('The selected image is too large after optimization.');
            }
            return imageData;
        }

        async function optimizePoster(file) {
            const image = await loadImage(file);
            const scale = Math.min(1, 640 / image.naturalWidth, 960 / image.naturalHeight);
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.fillStyle = '#111';
            context.fillRect(0, 0, width, height);
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = 'high';
            context.drawImage(image, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        function tmdbPosterUrl(path) {
            return `/api/tmdb/poster?path=${encodeURIComponent(path)}`;
        }

        function createTmdbPoster(path, title) {
            if (!path) {
                const placeholder = document.createElement('span');
                placeholder.className = 'tmdb-poster-placeholder';
                placeholder.textContent = 'No poster';
                return placeholder;
            }
            const image = document.createElement('img');
            image.src = tmdbPosterUrl(path);
            image.alt = `${title} poster`;
            image.loading = 'lazy';
            return image;
        }

        async function searchTmdb() {
            const query = tmdbSearchInput.value.trim();
            if (query.length < 2) {
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = 'Enter at least two characters.';
                return;
            }
            tmdbSearchController?.abort();
            tmdbSearchController = new AbortController();
            tmdbSearchButton.disabled = true;
            tmdbSearchStatus.textContent = 'Searching TMDB...';
            try {
                const response = await fetch(`/api/tmdb/search?q=${encodeURIComponent(query)}`, {
                    cache: 'no-store',
                    signal: tmdbSearchController.signal
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'TMDB search failed.');
                renderTmdbResults(payload.results || []);
                tmdbSearchStatus.textContent = payload.results?.length
                    ? `${payload.results.length} match${payload.results.length === 1 ? '' : 'es'} found.`
                    : 'No matching movies or series found.';
            } catch (error) {
                if (error.name === 'AbortError') return;
                console.error(error);
                tmdbResults.replaceChildren();
                tmdbSearchStatus.textContent = error.message || 'TMDB search failed.';
            } finally {
                tmdbSearchButton.disabled = tmdbSearchInput.disabled;
            }
        }

        async function selectTmdbTitle(result) {
            tmdbSearchController?.abort();
            tmdbDetailController?.abort();
            tmdbDetailController = new AbortController();
            tmdbSearchStatus.textContent = `Loading ${result.title}...`;
            try {
                const response = await fetch(`/api/tmdb/title/${result.mediaType}/${result.id}`, {
                    cache: 'no-store',
                    signal: tmdbDetailController.signal
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || 'TMDB title details could not be loaded.');
                selectedTmdbTitle = payload.title;
                addTitleForm.elements.title.value = payload.title.title;
                addTitleForm.elements.category.value = payload.title.category;
                addTitleForm.elements.duration.value = payload.title.duration;

                const poster = createTmdbPoster(payload.title.posterPath, payload.title.title);
                const copy = document.createElement('span');
                const title = document.createElement('strong');
                title.textContent = payload.title.title;
                const meta = document.createElement('small');
                meta.textContent = [payload.title.category, payload.title.year, payload.title.duration]
                    .filter(Boolean)
                    .join(' · ');

        async function posterDataForSubmission(posterFile) {
            if (posterFile instanceof File && posterFile.size > 0) {
                return optimizePoster(posterFile);
            }
            if (!selectedTmdbTitle?.posterPath) {
                throw new Error('Choose a poster file or select a TMDB title that has a poster.');
            }
            const response = await fetch(tmdbPosterUrl(selectedTmdbTitle.posterPath), {cache: 'no-store'});
            if (!response.ok) {
                const payload = await response.json().catch(() => ({}));
                throw new Error(payload.error || 'The TMDB poster could not be downloaded.');
            }
            return optimizePoster(await response.blob());
        }

            const top = Math.min(Math.max(inset, event.clientY - skinDialogDrag.offsetY), maxTop);
            skinDialog.style.left = left + 'px';

            skinDialogGeometry = {left, top, width: rect.width, height: rect.height};
            skinResizeHandle.style.left = (left + rect.width - 24) + 'px';

                startY: event.clientY,
                width: rect.width,
                height: rect.height,

                top: rect.top
            };

                const response = await fetch('/api/movies', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        title: fields.get('title'),
                        category: fields.get('category'),
                        format: fields.get('format'),
                        hdr: fields.get('hdr'),
                        audio: fields.get('audio'),
                        duration: fields.get('duration'),
                        family: fields.get('family') === 'true',
                        tmdbType: selectedTmdbTitle?.mediaType,
                        tmdbId: selectedTmdbTitle?.id,
                        posterData
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'The title could not be saved.');
                catalog.push(result.movie);
                refreshCatalog();
                resetAddTitleForm();
                addTitleDialog.close();
                showNotice(`${result.movie.title} was added to the library.`);
            } catch (error) {
                console.error(error);
                addTitleStatus.textContent = error.message || 'The title could not be saved.';
            } finally {
                saveTitleButton.disabled = false;
                saveTitleButton.textContent = 'Add title';
            }
        });

        async function loadCatalog() {
            count.textContent = 'Loading titles...';
            try {
                const response = await fetch('movies.json');
                if (!response.ok) throw new Error(`Catalog request failed: ${response.status}`);
                catalog = await response.json();
                refreshCatalog();
            } catch (error) {
                console.error(error);
                count.textContent = 'Unable to load the catalog.';
                const message = document.createElement('p');
                message.textContent = location.protocol === 'file:'
                    ? 'Open this site through a local web server so it can load movies.json.'
                    : 'The movie catalog could not be loaded.';
                grid.replaceChildren(message);
            }
        }

        buildSkinFields();
        loadSkins();
        loadCatalog();
        checkEditingAvailability();
    </script>
</body>
</html>
